version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insiedr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insiedr_pass}
      POSTGRES_DB: ${POSTGRES_DB:-insiedr_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insiedr} -d ${POSTGRES_DB:-insiedr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-insiedr_redis_pass}", "--save", "60", "1", "--loglevel", "warning", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-insiedr_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_DSN=postgresql://${POSTGRES_USER:-insiedr}:${POSTGRES_PASSWORD:-insiedr_pass}@db:5432/${POSTGRES_DB:-insiedr_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-insiedr_redis_pass}@redis:6379/0
      - PYTHONPATH=/app
      - SYSTEM_DEFAULT_PROFILE=${SYSTEM_DEFAULT_PROFILE:-DEFAULT}
      - ENABLE_CORROBORATION_GUARD=true
    volumes:
      - ./heuristics:/app/heuristics
      - ./server:/app/server
      - ./models:/app/models
    deploy:
      replicas: 3
    # Nginx will route to these instances on port 5000 internally

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

