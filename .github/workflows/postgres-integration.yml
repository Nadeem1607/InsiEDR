name: Postgres Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Postgres
        run: sleep 10
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
      - name: Run migrations
        env:
          INSIEDR_DATABASE_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          python - <<'PY'
          from server.storage.postgres_storage import PostgresStorage
          import os
          dsn = os.environ['INSIEDR_DATABASE_DSN']
          PostgresStorage(dsn=dsn).ensure_migrations()
          print('migrations applied')
          PY

      - name: Run Postgres integration tests
        env:
          INSIEDR_DATABASE_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q tests/test_postgres_integration.py -q
